const LANG_FLAGS = {
  en: "🇬🇧", "zh-CN": "🇨🇳", "zh-TW": "🇭🇰", es: "🇪🇸", pt: "🇧🇷",
  ja: "🇯🇵", ko: "🇰🇷", ru: "🇷🇺", ar: "🇸🇦", id: "🇮🇩",
  fr: "🇫🇷", th: "🇹🇭", vi: "🇻🇳", tr: "🇹🇷", fa: "🇮🇷"
};

const LANG_NAMES = {
  en: "English", "zh-CN": "简体中文", "zh-TW": "繁體中文", es: "Español",
  pt: "Português", ja: "日本語", ko: "한국어", ru: "Русский",
  ar: "العربية", id: "Indonesia", fr: "Français", th: "ไทย",
  vi: "Tiếng Việt", tr: "Türkçe", fa: "فارسی"
};

function detectLang() {
  const stored = localStorage.getItem("wc_lang");
  if (stored && ABOUT_I18N[stored]) return stored;
  const url = new URLSearchParams(location.search).get("lang");
  if (url && ABOUT_I18N[url]) return url;
  const b = (navigator.language || "en").toLowerCase();
  if (b.startsWith("zh-tw") || b.startsWith("zh-hk")) return "zh-TW";
  if (b.startsWith("zh")) return "zh-CN";
  const short = b.split("-")[0];
  if (ABOUT_I18N[short]) return short;
  return "en";
}

function applyLang(code) {
  const d = ABOUT_I18N[code] || ABOUT_I18N.en;
  document.documentElement.lang = code;
  document.documentElement.dir = d.dir;
  document.getElementById("header-label").textContent = d.headerLabel;
  document.getElementById("about-title").textContent = d.title;
  document.getElementById("about-body").innerHTML = d.body;
  document.getElementById("contact-title").textContent = d.contactTitle;
  document.getElementById("contact-desc").textContent = d.contactDesc;
  document.getElementById("back-btn").textContent = d.backBtn;
  // Sync with site-wide lang storage
  localStorage.setItem("wc_lang", code);
  // Update active button
  document.querySelectorAll(".lang-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.lang === code);
  });
}

function buildLangBar() {
  const bar = document.getElementById("lang-bar");
  Object.keys(ABOUT_I18N).forEach(code => {
    const btn = document.createElement("button");
    btn.className = "lang-btn";
    btn.dataset.lang = code;
    btn.textContent = `${LANG_FLAGS[code]} ${LANG_NAMES[code]}`;
    btn.addEventListener("click", () => applyLang(code));
    bar.appendChild(btn);
  });
}

buildLangBar();
applyLang(detectLang());
</script>
